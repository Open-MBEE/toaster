name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    # 24.04, not latest: the pinned Linux sysmlv2 needs GLIBC_2.39 and the Linux z3 needs
    # GLIBC_2.38 / GLIBCXX_3.4.32, which 22.04 does not provide.
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.5.x"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install Python dependencies
        run: uv sync --locked

      - name: Install Node dependencies
        run: npm ci

      - name: Record tool versions in the job summary
        run: |
          {
            echo "### Runner toolchain"
            echo '```'
            uv --version
            uv run python --version
            echo "node $(node --version)"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Install system tools
        run: sudo apt-get update && sudo apt-get install -y graphviz openjdk-17-jre-headless

      - name: Show Java version
        run: java -version

      - name: Cache provisioned tools
        uses: actions/cache@v4
        with:
          path: .tools
          key: tools-${{ runner.os }}-${{ hashFiles('scripts/tool-pins.json') }}

      - name: Provision pinned tools
        run: uv run python scripts/provision-tools.py

      - name: Check tool versions
        run: uv run python scripts/check-tools.py

      - name: Run tests
        env:
          TOASTER_REQUIRE_TOOLS: "1"
        run: uv run pytest tests/ glossary/tests/ -v --tb=short

      # `myst build` exits 0 even when a notebook cell raises; `--strict` makes it exit 1.
      # `uv run` puts .venv/bin first on PATH so the Jupyter kernel finds the toaster package.
      - name: Build the book (with execution)
        env:
          BASE_URL: /toaster
        run: |
          set -o pipefail
          uv run --frozen npx myst build --html --execute --strict 2>&1 | tee build.log

      - name: Check the built site (release gate)
        run: >-
          uv run python scripts/check-site.py
          --site _build/html
          --content _build/site/content
          --log build.log
          --base-url /toaster

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
          if-no-files-found: warn

      # Only a push to main produces the Pages artifact; pull requests stop
      # after the gate above.
      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _build/html

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
