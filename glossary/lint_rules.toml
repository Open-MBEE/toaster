# Lint rules for learner-facing content (see glossary/lint.py).
# Every rule needs: id, regex (matched case-insensitively), message, why, severity, scope.
# severity: "error" | "warn".  scope: "learner".
# Use (?-i:...) inside a regex to require exact case for part of it.
# Optional: ignore_code = true (boolean, default false) matches the rule against a copy of the text in which
# fenced blocks and inline code spans are blanked out (same length, line numbers unchanged).

[[rule]]
id = "tall-named"
regex = '''\b(?-i:Tall)\b|\bthree[\s-]+worlds\b|\b(?-i:A-F)\b|\b(?-i:O-S)\b'''
message = "The three-worlds lens is builder-facing; do not name Tall (or its A-F/O-S abbreviations) in learner content."
why = "AGENTS.md 1.10; DL-050 (found by two independent simulated learners, invisible to this rule until widened)"
severity = "error"
scope = "learner"

[[rule]]
id = "no-em-dash"
regex = '''—'''
message = "No em-dashes in learner-facing prose (tutorial-style-guide). Use a period, comma, colon, or parentheses."
why = "tutorial-style-guide, prose style"
severity = "error"
scope = "learner"

[[rule]]
id = "concept-selection"
regex = '''\bconcept\s+selection\b'''
message = "Say \"selection among alternatives\"."
why = "AGENTS.md 1.5 / glossary term selection among alternatives"
severity = "error"
scope = "learner"

[[rule]]
id = "sub-behavior"
regex = '''\bsub-behaviou?rs?\b'''
message = "Do not use \"sub-behavior\"."
why = "DL-017"
severity = "error"
scope = "learner"

[[rule]]
id = "stale-physical-layer"
regex = '''\bphysical\s+architecture\s+layers?\b'''
message = "Layers are what/how/where; the system of interest is the subject."
why = "AGENTS.md 1.5"
severity = "error"
scope = "learner"

[[rule]]
id = "stale-partition"
regex = '''\bpartitioned\s+into\s+implementation-agnostic\b'''
message = "Stale phrasing for the layer partition."
why = "AGENTS.md 1.5"
severity = "error"
scope = "learner"

[[rule]]
id = "accepted-disposition"
regex = '''\bdispositions?\b(?:\W+\w+){0,4}?\W+accepted\b|\baccepted\s+dispositions?\b'''
message = "No judgment record disposition is \"accepted\"."
why = "SA-7"
severity = "warn"
scope = "learner"

[[rule]]
id = "opensysml-contrast-or-and"
regex = '''OpenSysML\s+(or|and|nor|vs\.?|versus)\s+sysml-toolkit'''
message = "Bare \"OpenSysML\" names the stack, so it cannot be contrasted with or joined to sysml-toolkit. Name the component: \"the OpenSysML runtime\" and sysml-toolkit."
why = "AGENTS.md 1.2 (OpenSysML naming convention); DL-116 (guard), DL-118 (ignore_code scope)"
severity = "error"
scope = "learner"
ignore_code = true

[[rule]]
id = "toolkit-and-opensysml"
regex = '''sysml-toolkit\s+(or|and)\s+OpenSysML'''
message = "Bare \"OpenSysML\" names the stack, so it cannot be joined to sysml-toolkit. Name the component: sysml-toolkit and \"the OpenSysML runtime\"."
why = "AGENTS.md 1.2 (OpenSysML naming convention); DL-116 (guard), DL-118 (ignore_code scope)"
severity = "error"
scope = "learner"
ignore_code = true

[[rule]]
id = "neither-opensysml"
regex = '''neither\s+OpenSysML'''
message = "A \"neither\" claim needs two named components: \"neither the OpenSysML runtime nor sysml-toolkit\", or say \"no tool\"."
why = "AGENTS.md 1.2 (OpenSysML naming convention); DL-116 (guard), DL-118 (ignore_code scope)"
severity = "error"
scope = "learner"
ignore_code = true

[[rule]]
id = "not-opensysml"
regex = '''not\s+OpenSysML'''
message = "A negative claim needs the component that was probed: say \"not the OpenSysML runtime\" (or name sysml-toolkit)."
why = "AGENTS.md 1.2 (OpenSysML naming convention); DL-116 (guard), DL-118 (ignore_code scope)"
severity = "error"
scope = "learner"
ignore_code = true

[[rule]]
id = "opensysml-capability"
regex = '''OpenSysML\s+(alone|itself|cannot|can't|does\s+not|doesn't|only)'''
message = "A capability claim names the component that was probed: \"the OpenSysML runtime cannot ...\" or \"sysml-toolkit does not ...\"."
why = "AGENTS.md 1.2 (OpenSysML naming convention); DL-116 (guard), DL-118 (ignore_code scope)"
severity = "error"
scope = "learner"
ignore_code = true

[[rule]]
id = "opensysml-version"
regex = '''OpenSysML\s+v0\.9'''
message = "Versions attach to component names: \"the OpenSysML runtime v0.9.0\", \"sysml-toolkit v0.9.1\"."
why = "AGENTS.md 1.2 (OpenSysML naming convention); DL-116 (guard), DL-118 (ignore_code scope)"
severity = "error"
scope = "learner"
ignore_code = true
