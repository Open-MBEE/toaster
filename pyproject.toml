[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "toaster"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "opensysml==0.9.0",
  "jupyterlab>=4.2",
  "ipykernel>=6.29",
  "nbformat>=5.10",
  "nbclient>=0.10",
  "numpy>=2.0",
  "sympy>=1.13",
  "matplotlib>=3.9",
  "tabulate>=0.9",
  "rdflib>=7.6.0",
  "pyshacl>=0.40.1",
  "typer>=0.27.2",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.4",
]

[tool.pytest.ini_options]
markers = [
  "checkpoint: verify notebook construction cells are consistent with committed fixtures",
]
addopts = "-m 'not checkpoint'"

[tool.hatch.build.targets.wheel]
packages = ["src/toaster"]
